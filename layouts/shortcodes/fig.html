{{/* Usage: {{< fig src="img/research/x.jpg" alt="..." caption="..." width="420" >}}  (width is an optional max width in px) */}}
<figure class="fig"{{ with .Get "width" }} style="max-width:{{ . }}px"{{ end }}>
  <img src="{{ .Get "src" | relURL }}" alt="{{ .Get "alt" }}" loading="lazy">
  {{ with .Get "caption" }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}
</figure>

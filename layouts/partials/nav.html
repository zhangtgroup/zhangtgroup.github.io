<nav class="site-nav">
  <div class="nav-inner">
    <a class="nav-brand" href="{{ "/" | relURL }}"><span>Zhang</span> Research Group</a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" onclick="var l=document.querySelector('.nav-links');l.classList.toggle('open');this.setAttribute('aria-expanded',l.classList.contains('open'))">☰</button>
    <ul class="nav-links">
      {{ range .Site.Menus.main }}
      <li><a href="{{ .URL | relURL }}" {{ if or (eq $.RelPermalink .URL) (and (ne .URL "/") (hasPrefix $.RelPermalink .URL)) }}class="active"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
    </ul>
    <script>
      document.querySelectorAll('.nav-links a').forEach(function (a) {
        a.addEventListener('click', function () {
          document.querySelector('.nav-links').classList.remove('open');
        });
      });
    </script>
  </div>
</nav>
